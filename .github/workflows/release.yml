name: release

# Builds the Windows zip and the Linux AppImage when a version tag (v1.2.3) is pushed and publishes them as a release,
# with RELEASE_NOTES.md as its notes. Each package is attached twice: with its version in the name, and without
# (MagiciansQuest-Recomp-windows-x64.zip, MagiciansQuest-Recomp-x86_64.AppImage), so that
# https://github.com/waifoof/MagiciansQuest-Recomp/releases/latest/download/<that name> always gets the newest release.
# A tag with a suffix (v1.1.0-beta) is published as a pre-release, which those links skip.
# (The workflow never receives a ROM or any game data; tools/package.py scans each package for it.)

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Package
        run: python tools/package.py windows
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.zip
          if-no-files-found: error

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Package (in Docker)
        run: python3 tools/package.py linux
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*.AppImage
          if-no-files-found: error

  publish:
    needs: [windows, linux]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true
      - name: Copies without the version in the name
        run: |
          cd packages
          for f in *-windows-x64.zip; do cp "$f" MagiciansQuest-Recomp-windows-x64.zip; done
          for f in *-x86_64.AppImage; do cp "$f" MagiciansQuest-Recomp-x86_64.AppImage; done
          ls -l
      - name: Checksums
        run: cd packages && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""
          case "$GITHUB_REF_NAME" in *-*) pre="--prerelease" ;; esac
          latest=$([ -z "$pre" ] && echo true || echo false)
          title="Magician's Quest Recomp ${GITHUB_REF_NAME#v}"
          # The release may already exist when the tag was made from the GitHub
          # website's "Draft a new release" page; fill that one in instead.
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" $pre --latest=$latest \
              --title "$title" --notes-file RELEASE_NOTES.md --draft=false
            gh release upload "$GITHUB_REF_NAME" packages/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" packages/* --repo "$GITHUB_REPOSITORY" $pre --latest=$latest \
              --title "$title" --notes-file RELEASE_NOTES.md
          fi
