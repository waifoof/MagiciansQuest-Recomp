name: build

# (Actions minutes are limited on a private repository: builds run for main only, and Windows is built by
# windows-package, which makes the download too.)
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install toolchain
        run: >-
          sudo apt-get update && sudo apt-get install -y clang ninja-build cmake
          libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev libxfixes-dev libxtst-dev
          libwayland-dev libxkbcommon-dev libegl-dev libdrm-dev libgbm-dev libasound2-dev libpulse-dev
      - name: Configure
        run: cmake --preset linux-release
      - name: Build
        run: cmake --build --preset linux-release
      - name: Unit tests
        run: ctest --preset linux-release
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # (Advisory: `pip install unicorn` currently fails on the hosted runner, so this step does not fail the build.)
      - name: Recompiler differential tests (vs Unicorn ARM946)
        continue-on-error: true
        run: |
          pip install unicorn
          python tests/difftest/difftest.py --recomp build/linux-release/recompiler/ntr-recomp --count 500 > difftest.log 2>&1 || {
            tail -c 1500 difftest.log | tr -d '\033' | sed 's/::/: :/g' > tail.txt
            echo "::error title=difftest::$(sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g' tail.txt)"; exit 1; }

  windows:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Configure
        run: cmake --preset release
      - name: Build
        run: cmake --build --preset release
      # (ui_smoke needs OpenGL, which the hosted Windows runners do not have: it crashes there at the first GL call.)
      - name: Unit tests
        shell: bash
        run: |
          # On failure, the end of the output becomes an annotation (readable from the run's summary).
          ctest --preset release --output-on-failure -E ui_smoke > ctest.log 2>&1 || {
            echo "::error title=ctest::$(tail -c 3500 ctest.log | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')"; exit 1; }
