name: windows-package

# A ready-to-run Windows zip for every push to main (and on demand): the program, the bundled clang that builds the
# game from your ROM, and the licences. It contains no game code or data (tools/package.py scans it). Download it from
# the run's "Artifacts" section on GitHub.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  package:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Package
        shell: bash
        run: |
          python tools/package.py windows > package.log 2>&1 || {
            echo "::error title=package::$(tail -c 3500 package.log | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')"; exit 1; }
          tail -3 package.log
      - uses: actions/upload-artifact@v4
        with:
          name: MagiciansQuest-windows
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 30
