name: windows-package

# A ready-to-run Windows zip for every push to main (and on demand): the program, the bundled clang that builds the
# game from your ROM, and the licences. It contains no game code or data (tools/package.py scans it). Download it from
# the run's "Artifacts" section on GitHub, or from the rolling "latest" pre-release.
# The linux job puts the Linux AppImage (Steam Deck) on the same pre-release. The two jobs are independent: each one
# uploads and removes only its own file names (*-windows-x64.zip, *-x86_64.AppImage), and only after its package was
# built, so a failed Linux build can never take the Windows zip away (nor the other way round).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write  # (the "latest" pre-release below)

jobs:
  package:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Package
        shell: bash
        run: |
          python tools/package.py windows > package.log 2>&1 || {
            echo "::error title=package::$(tail -c 3500 package.log | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')"; exit 1; }
          # (the compiler's and linker's warnings on our own sources, in the job's log: package.log is not kept)
          echo "warnings in our sources:"; grep -E ': warning (C[0-9]+|LNK[0-9]+)' package.log | grep -v -i -E 'third_party|_deps' | sort -u | head -300 || true
          tail -3 package.log
      - uses: actions/upload-artifact@v4
        with:
          name: MagiciansQuest-windows
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 30
      # The same zip on a rolling "latest" pre-release: a plain download link, no sign-in needed.
      - name: Publish to the latest pre-release
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # (the Linux job may be creating the release at the same moment: look again before giving up)
          gh release view latest >/dev/null 2>&1 || gh release create latest --prerelease --title "Latest build" \
            --notes "Built automatically from main. No game data: choose your own ROM on the start screen." || \
            { sleep 20; gh release view latest >/dev/null; }
          gh release upload latest dist/*.zip --clobber
          # (only this job's own older zips: the Linux job's AppImage on the same release is left alone)
          new="$(basename dist/*.zip)"
          for f in $(gh release view latest --json assets -q '.assets[].name'); do
            case "$f" in *-windows-x64.zip) [ "$f" = "$new" ] || gh release delete-asset latest "$f" -y ;; esac
          done
          { echo "Built automatically from main ($GITHUB_SHA)."; echo; cat RELEASE_NOTES.md; } > notes.md
          gh release edit latest --target "$GITHUB_SHA" --notes-file notes.md

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Package (in Docker, Ubuntu 22.04, glibc 2.35)
        shell: bash
        run: |
          python3 tools/package.py linux > package.log 2>&1 || {
            echo "::error title=package::$(tail -c 3500 package.log | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')"; exit 1; }
          tail -3 package.log
      - uses: actions/upload-artifact@v4
        with:
          name: MagiciansQuest-linux
          path: dist/*.AppImage
          if-no-files-found: error
          retention-days: 30
      - name: Publish to the latest pre-release
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # (the Windows job may be creating the release at the same moment: look again before giving up)
          gh release view latest >/dev/null 2>&1 || gh release create latest --prerelease --title "Latest build" \
            --notes "Built automatically from main. No game data: choose your own ROM on the start screen." || \
            { sleep 20; gh release view latest >/dev/null; }
          gh release upload latest dist/*.AppImage --clobber
          # (only this job's own older AppImages: never the Windows zip)
          new="$(basename dist/*.AppImage)"
          for f in $(gh release view latest --json assets -q '.assets[].name'); do
            case "$f" in *-x86_64.AppImage) [ "$f" = "$new" ] || gh release delete-asset latest "$f" -y ;; esac
          done
